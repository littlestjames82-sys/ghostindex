[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ghostindex"
version = "0.1.0"
description = "Cross-project local search index for GhostSlice: sqlite FTS5 over the projects you name, ranked sliced excerpts out, offline only"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Ghost Developer Studio" }]
keywords = ["llm", "context", "ghostslice", "search", "fts5", "agents"]
dependencies = []

[project.scripts]
ghostindex = "ghostindex.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
